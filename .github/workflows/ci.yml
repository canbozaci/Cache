name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full suite is the configuration matrix, the geometry sweep, the random
    # traffic cases, the block tests and the parameter compile sweep. It takes
    # well over the default step budget on a cold ccache.
    timeout-minutes: 120

    env:
      UVM_HOME: ${{ github.workspace }}/uvm-core/src
      # Must match the version the suite is validated against locally; see the
      # Build Verilator step for why the packaged one cannot be used.
      VERILATOR_VERSION: v5.050

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make iverilog ripgrep \
            git help2man perl python3 autoconf g++ flex bison ccache \
            libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev \
            zlib1g zlib1g-dev z3

      # z3 above is not optional. Verilator hands constrained randomization to an
      # external SMT solver and detects which one at *configure* time, so it has
      # to be installed before the build below, not just before the run. Without
      # it the simple constraints still solve but cache_traffic_item's do not,
      # and the random traffic seeds die at 200ns with
      # "UVM_FATAL [RANDFAIL] cache_traffic_item randomization failed" while
      # every directed case still passes -- which reads like a stimulus bug
      # rather than a missing package.

      # Verilator is built from source, pinned, rather than taken from apt.
      #
      # The distribution package is 5.020, which does not implement `##` cycle
      # delays in sequence expressions at all. Three checks in this testbench
      # use them -- the eventually-errors assertion for a line maintenance
      # command with no address, and two cover bins -- so the whole build fails
      # to elaborate on the packaged version even though the suite passes
      # locally. Pinning here makes CI test the same tool the suite is developed
      # and validated against, rather than a different one.
      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          # The solver is part of the key: Verilator bakes the SMT solver it
          # found into the build, so an install cached from before z3 was
          # added would still fail randomization.
          key: verilator-${{ env.VERILATOR_VERSION }}-z3-${{ runner.os }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git verilator-src
          cd verilator-src
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: echo "$HOME/verilator-install/bin" >> "$GITHUB_PATH"

      # UVM is not packaged by any distribution, and `make verify` refuses to
      # run without it rather than silently skipping the UVM stages. Pinned to a
      # tag so a change upstream cannot turn a green branch red on its own. 2020.3.1
      # is the version the suite is developed and validated against locally.
      - name: Fetch UVM
        run: |
          git clone --depth 1 --branch 2020.3.1 \
            https://github.com/accellera-official/uvm-core.git uvm-core
          test -f "$UVM_HOME/uvm_pkg.sv"

      # Confirms the pin actually took effect, and leaves the version in the
      # log. Several things the suite relies on are version-sensitive: `##`
      # cycle delays in sequences, SVA cover directives under --coverage-user
      # (covergroups are not implemented at all), --binary --timing, and the
      # absence of `bind` into a uvm_pkg-importing module.
      - name: Tool versions
        run: |
          verilator --version
          iverilog -V | head -1

      # The full output is megabytes -- every Verilator compile line and the
      # complete UVM report for all 30 configurations -- which the web log view
      # truncates, leaving a step you cannot read. So the run goes to a file and
      # only a condensed view reaches the console: the stage banners, the case
      # names, and on failure the errors themselves with the zero-count summary
      # lines filtered out (every passing case prints "UVM_ERROR :    0", which
      # otherwise buries the real ones).
      #
      # The complete logs are uploaded as an artifact either way.
      - name: Verify cache
        run: |
          set +e
          make verify > verify.log 2>&1
          rc=$?
          set -e

          echo "===== stages ====="
          grep -E "^MAKE .* (STARTED|FINISHED)$|^PASSED$|^FAILED$" verify.log || true

          echo
          echo "===== configurations ====="
          grep -E "^UVM CASE:" verify.log || true

          if [ "$rc" -ne 0 ]; then
            echo
            echo "===== failures ====="
            grep -nE "^CASE FAILED|BUILD FAILED|%Error" verify.log | head -40 || true
            echo
            echo "===== first errors ====="
            grep -nE "UVM_ERROR|UVM_FATAL" verify.log \
              | grep -v "UVM_ERROR :    0" \
              | grep -v "UVM_FATAL :    0" \
              | head -40 || true
            echo
            echo "Full logs are in the verify-logs artifact for this run."
          fi

          exit $rc

      # Kept on failure so a red run can be diagnosed without reproducing it
      # locally: the per-case run logs carry the UVM report summaries and any
      # assertion or checker output.
      # Uploaded on success too: a green run's logs are what you compare against
      # when a later one goes red, and they are the only place the per-case UVM
      # reports survive.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            verify.log
            sim/**/*.log
          retention-days: 14
          if-no-files-found: ignore
